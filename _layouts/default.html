{%- assign profile = site.data.profile -%}
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="{{ profile.name }}">
  <meta name="theme-color" content="#05060a">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32 48x48">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ profile.name }} 的个人主页：头像与简介，星空背景">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- 背景：星场 + 星云 + 光标光晕 -->
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>
  <div class="spotlight" aria-hidden="true"></div>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <main class="shell" id="main">
    <div class="panel">
      {{ content }}

      <footer class="foot">
        <p>© {{ site.time | date: '%Y' }} {{ profile.name }}</p>
      </footer>
    </div>
  </main>

  <script src="{{ '/assets/js/starfield.js' | relative_url }}" defer></script>
</body>
</html>
