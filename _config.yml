# ─────────────────────────────────────────────────────────────
#  Jekyll 站点配置
#  个人信息不在这里，在 _data/profile.yml 里改。
# ─────────────────────────────────────────────────────────────

title: AJM
description: AJM 的个人主页 —— 在读大二学生，生活在宁波。

# 站点地址。
#  本站已绑定自定义域名 sjmer.top（仓库根目录的 CNAME 文件就是干这个的，别删）。
#  因为用的是独立域名，baseurl 必须保持为空。
#  以后换域名要同时改这两处：这里的 url，以及根目录的 CNAME 文件。
url: "https://sjmer.top"
baseurl: ""

lang: zh-CN
timezone: Asia/Shanghai

markdown: kramdown
permalink: /:title/

# 不需要出现在网站里的文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .gitignore
  - tools

# 本站不使用任何 Jekyll 插件，保证依赖最少、构建最稳。
plugins: []
